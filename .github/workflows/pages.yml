name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "examples/**"
      - "src/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install .
      - name: Build demo catalog from synthetic examples
        run: |
          mkdir -p site
          api-error-catalog scan examples/specs --format html --output site/index.html --quiet
          api-error-catalog scan examples/specs --format markdown --output site/catalog.md --quiet
          api-error-catalog scan examples/specs --format json --output site/catalog.json --quiet
      - uses: actions/configure-pages@v5
        with:
          # Create the Pages site (source: GitHub Actions) on first run.
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
