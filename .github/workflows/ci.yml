name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, test and run examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest --cov --cov-report=term-missing

      - name: Run CLI on examples (conflicts expected)
        run: |
          api-error-catalog scan examples/specs
          api-error-catalog scan examples/specs --format markdown --output out/catalog.md --quiet
          api-error-catalog scan examples/specs --format html --output out/catalog.html --quiet
          api-error-catalog scan examples/specs --format json --output out/catalog.json --quiet
          ls -la out

      - name: Verify exit codes
        run: |
          set +e
          api-error-catalog scan tests/fixtures/clean --fail-on-conflict > /dev/null; c0=$?
          api-error-catalog scan examples/specs --fail-on-conflict > /dev/null; c1=$?
          api-error-catalog scan tests/fixtures/invalid > /dev/null 2>&1; c2=$?
          set -e
          echo "clean=$c0 conflict=$c1 invalid=$c2"
          test "$c0" -eq 0 && test "$c1" -eq 1 && test "$c2" -eq 2

      - name: Verify governance (baseline + exceptions)
        run: |
          cfg=examples/governance/.api-error-catalog.yaml
          # The committed baseline must not list debt that has already been fixed.
          api-error-catalog baseline update examples/specs -c "$cfg" --check
          set +e
          # Legacy debt is accepted: green.
          api-error-catalog scan examples/specs -c "$cfg" --fail-on-conflict --today 2026-09-24 > /dev/null; g0=$?
          # After an exception expires the finding is enforced again: red.
          api-error-catalog scan examples/specs -c "$cfg" --fail-on-conflict --today 2027-07-01 > /dev/null; g1=$?
          # A new conflict on top of the baseline: red.
          cp -r examples/specs /tmp/specs
          sed 's/Auth API/Billing API/; s/"404"/"422"/; s/'"'"'404'"'"'/'"'"'422'"'"'/' examples/specs/auth-api.yaml > /tmp/specs/billing-api.yaml
          api-error-catalog scan /tmp/specs -c "$cfg" --fail-on-conflict --today 2026-09-24 > /dev/null; g2=$?
          set -e
          echo "accepted=$g0 expired=$g1 new-debt=$g2"
          test "$g0" -eq 0 && test "$g1" -eq 1 && test "$g2" -eq 1

      - name: Render example reports and demo page
        run: |
          python scripts/build_examples.py
          python scripts/build_examples.py --check
          cp examples/expected/* out/

      - name: Publish example report to job summary
        run: cat out/catalog.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: example-reports
          path: out/
