[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-error-catalog"
version = "0.1.0"
description = "Generate a searchable error-code catalog from OpenAPI specifications and detect inconsistent API error contracts across microservices."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "api-error-catalog contributors" }]
keywords = ["openapi", "api", "errors", "governance", "linting", "microservices"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "typer>=0.12",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
api-error-catalog = "api_error_catalog.cli:app"

[project.urls]
Homepage = "https://github.com/VsevaTech/api-error-catalog"
Repository = "https://github.com/VsevaTech/api-error-catalog"
Issues = "https://github.com/VsevaTech/api-error-catalog/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"api_error_catalog.reporters" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["api_error_catalog"]
